
name: .NET CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore CRUD_VscodeCore/CRUD_VscodeCore.sln

      - name: Build solution
        run: dotnet build CRUD_VscodeCore/CRUD_VscodeCore.sln --configuration Release --no-restore
